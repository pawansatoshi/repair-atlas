version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        # Amplify app environment variables are available to the build, but
        # Next.js server-side runtime does not receive them automatically.
        # Bridge only the server runtime configuration needed by RepairAtlas.
        # Do not add client-side or NEXT_PUBLIC_ secrets here.
        - env | grep -E '^(DATABASE_URL|DATABASE_SSL|DB_POOL_MAX|DEMO_ORG_ID|BEDROCK_REGION|BEDROCK_EMBED_REGION|BEDROCK_MODEL_ID|BEDROCK_EMBED_MODEL_ID|REPAIR_ATLAS_EMBEDDING_API_URL|COCKROACH_MCP_URL)=' >> .env.production || true
        - npm run typecheck
        - npm run lint
        - npm run test
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
